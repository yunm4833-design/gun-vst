name: Build BREACH Resonator VST3 & AU

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (Universal macOS VST3 + AU)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload macOS VST3 & AU Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BreachResonator-macOS-VST3-AU
          path: |
            build/BreachResonator_artefacts/Release/VST3/*.vst3
            build/BreachResonator_artefacts/Release/AU/*.component

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (Windows x64 VST3)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload Windows VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BreachResonator-Windows-VST3
          path: build/BreachResonator_artefacts/Release/VST3/*.vst3
