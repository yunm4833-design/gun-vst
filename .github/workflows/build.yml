name: Build BREACH Resonator VST3 & AU

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (Universal macOS)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package macOS VST3, AU and Standalone
        shell: bash
        run: |
          root=build/BreachResonator_artefacts/Release
          package=build/package-macos
          mkdir -p "$package" dist
          ditto "$root/VST3/BREACH Resonator.vst3" "$package/BREACH Resonator.vst3"
          ditto "$root/AU/BREACH Resonator.component" "$package/BREACH Resonator.component"
          ditto "$root/Standalone/BREACH Resonator.app" "$package/BREACH Resonator.app"
          ditto Licenses "$package/Licenses"
          ditto -c -k --sequesterRsrc "$package" dist/BreachResonator-macOS-Universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BreachResonator-macOS-Universal
          path: dist/BreachResonator-macOS-Universal.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (Windows x64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package Windows VST3 and Standalone
        shell: pwsh
        run: |
          $root = 'build/BreachResonator_artefacts/Release'
          $package = 'build/package-windows'
          New-Item -ItemType Directory -Force $package, dist | Out-Null
          Copy-Item "$root/VST3/BREACH Resonator.vst3" $package -Recurse
          Copy-Item "$root/Standalone/BREACH Resonator.exe" $package
          Copy-Item Licenses $package -Recurse
          Compress-Archive -Path "$package/*" -DestinationPath dist/BreachResonator-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BreachResonator-Windows-x64
          path: dist/BreachResonator-Windows-x64.zip
          if-no-files-found: error
