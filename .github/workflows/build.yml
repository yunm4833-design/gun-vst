name: Build BREACH Resonator VST3 & AU

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version of an existing draft release to receive the packages
        required: false
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (Universal macOS)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package macOS VST3, AU and Standalone
        shell: bash
        run: |
          root=build/BreachResonator_artefacts/Release
          package=build/package-macos
          mkdir -p "$package" dist
          ditto "$root/VST3/BREACH Resonator.vst3" "$package/BREACH Resonator.vst3"
          ditto "$root/AU/BREACH Resonator.component" "$package/BREACH Resonator.component"
          ditto "$root/Standalone/BREACH Resonator.app" "$package/BREACH Resonator.app"
          ditto Licenses "$package/Licenses"
          for bundle in "$package"/*.vst3 "$package"/*.component "$package"/*.app; do
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
            lipo "$bundle/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          done
          ditto -c -k --sequesterRsrc "$package" dist/BreachResonator-macOS-Universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BreachResonator-macOS-Universal
          path: dist/BreachResonator-macOS-Universal.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (Windows x64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package Windows VST3 and Standalone
        shell: pwsh
        run: |
          $root = 'build/BreachResonator_artefacts/Release'
          $package = 'build/package-windows'
          New-Item -ItemType Directory -Force $package, dist | Out-Null
          Copy-Item "$root/VST3/BREACH Resonator.vst3" $package -Recurse
          Copy-Item "$root/Standalone/BREACH Resonator.exe" $package
          Copy-Item Licenses $package -Recurse
          Compress-Archive -Path "$package/*" -DestinationPath dist/BreachResonator-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BreachResonator-Windows-x64
          path: dist/BreachResonator-Windows-x64.zip
          if-no-files-found: error

  attach-release-assets:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: BreachResonator-*
          path: release
          merge-multiple: true
      - name: Attach packages and documentation to the draft
        shell: bash
        run: |
          version=$(awk '/^project[(]BreachResonator VERSION / {print $3}' CMakeLists.txt)
          if [[ "$RELEASE_TAG" != "$version" ]]; then
            echo "::error::The draft tag must match the CMake project version."
            exit 1
          fi
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '[.isDraft,.targetCommitish] | @tsv')
          if [[ "$draft" != $'true\t'"$GITHUB_SHA" ]]; then
            echo "::error::The draft release must point to this commit."
            exit 1
          fi
          mac_package="release/BREACH-Resonator-$version-macOS-Universal.zip"
          windows_package="release/BREACH-Resonator-$version-Windows-x64.zip"
          mv release/BreachResonator-macOS-Universal.zip "$mac_package"
          mv release/BreachResonator-Windows-x64.zip "$windows_package"
          unzip -tq "$mac_package"
          unzip -tq "$windows_package"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$mac_package" "$windows_package" Docs/BREACH-Resonator-Preview.png \
            "Docs/BREACH-Resonator-$version-User-Manual-EN.pdf" \
            "Docs/BREACH-Resonator-$version-User-Manual-ZH-CN.pdf"
